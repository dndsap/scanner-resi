<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Resi</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body{margin:0;background:#f2f2f2;font-family:Arial,sans-serif;text-align:center}
    h1{background:#111;color:#fff;margin:0;padding:18px;font-size:26px}
    .box{background:#fff;max-width:520px;margin:25px auto;padding:20px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
    #reader{width:100%;max-width:480px;margin:auto}
    #hasil{font-size:28px;font-weight:bold;margin:20px 0}
    #resi{font-size:22px;word-break:break-all}
    .siap{color:#0a9f45}.batal{color:#d60000}.info{color:#777}
    button{font-size:18px;padding:12px 20px;border:0;border-radius:10px;background:#111;color:white}
  </style>
</head>
<body>
  <h1>SCANNER RESI</h1>
  <div class="box">
    <div id="reader"></div>
    <div id="hasil" class="info">SIAP SCAN</div>
    <div id="resi">-</div>
  </div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwwZxv51oYAUrK_6ulhxsZ13GiVgFFrYs3b9KEuUmbDDFa2GJ2vZCPkfeL31bHEvzNL/exec";
let sedangKirim = false;
let scanner;

function kirimResi(resi){
  if(sedangKirim) return;
  sedangKirim = true;

  const callback = "hasilScan_" + Date.now();

  window[callback] = function(data){
    const status = document.getElementById("hasil");
    document.getElementById("resi").textContent = data.resi || resi;

    status.textContent = data.status || "BATAL";
    status.className = (data.status === "SIAP KIRIM") ? "siap" : "batal";

    delete window[callback];
    const s = document.getElementById("jsonp_"+callback);
    if(s) s.remove();

    setTimeout(function(){
      sedangKirim = false;
      status.textContent = "SIAP SCAN";
      status.className = "info";
    }, 1500);
  };

  const script = document.createElement("script");
  script.id = "jsonp_"+callback;
  script.src = API + "?api=scan&resi=" + encodeURIComponent(resi) + "&callback=" + callback;
  script.onerror = function(){
    document.getElementById("hasil").textContent = "GAGAL TERHUBUNG";
    document.getElementById("hasil").className = "batal";
    delete window[callback];
    script.remove();
    setTimeout(function(){ sedangKirim=false; }, 1500);
  };
  document.body.appendChild(script);
}

function onScanSuccess(decodedText){
  const resi = String(decodedText || "").trim();
  if(!resi || sedangKirim) return;
  kirimResi(resi);
}

function onScanFailure(error){}

scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: {width: 280, height: 160},
    rememberLastUsedCamera: true,
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
  },
  false
);

scanner.render(onScanSuccess, onScanFailure);
</script>
</body>
</html>
