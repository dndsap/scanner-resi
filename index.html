<!DOCTYPE html>
<html>
<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Scanner Resi</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      background: #111;
      color: white;
      margin: 0;
      padding: 18px;
      font-size: 26px;
    }

    .box {
      background: white;
      max-width: 520px;
      margin: 25px auto;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    #reader {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    #hasil {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    #resi {
      font-size: 22px;
      word-break: break-all;
    }

    .siap {
      color: #0a9f45;
    }

    .batal {
      color: #d60000;
    }

    .info {
      color: #777;
    }

  </style>

</head>

<body>

<h1>SCANNER RESI</h1>

<div class="box">

  <div id="reader"></div>

  <div
    id="hasil"
    class="info">

    SIAP SCAN

  </div>

  <div id="resi">
    -
  </div>

</div>


<!-- Iframe tersembunyi -->
<iframe
  name="kirimFrame"
  id="kirimFrame"
  style="display:none;">
</iframe>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzxUIOcb9TNVyG2553LRVRj5ZEPhjpj3oiJR4StQooW1ZvMBULUMnyVp0YgtvGI3cFW/exec";


let sedangKirim = false;

let resiTerakhir = "";


// ======================================
// TAMPILKAN STATUS
// ======================================

function tampil(status, resi) {

  const hasil =
    document.getElementById("hasil");

  const nomor =
    document.getElementById("resi");


  hasil.textContent =
    status;


  nomor.textContent =
    resi || "-";


  if (status === "SIAP KIRIM") {

    hasil.className =
      "siap";

  }

  else if (status === "BATAL") {

    hasil.className =
      "batal";

  }

  else {

    hasil.className =
      "info";

  }

}


// ======================================
// KIRIM RESI
// ======================================

function kirimResi(resi) {

  if (sedangKirim) return;


  resi = String(resi || "")
    .trim()
    .toUpperCase();


  if (!resi) return;


  // ==================================
  // CEGAH BARCODE YANG SAMA
  // TERBACA BERULANG KALI
  // ==================================

  if (resi === resiTerakhir) {

    return;

  }


  sedangKirim = true;

  resiTerakhir = resi;


  // ==================================
  // TAMPILKAN LANGSUNG
  // ==================================

  document.getElementById(
    "resi"
  ).textContent = resi;


  document.getElementById(
    "hasil"
  ).textContent =
    "MEMPROSES...";


  document.getElementById(
    "hasil"
  ).className =
    "info";


  // ==================================
  // FORM GET
  // ==================================

  const form =
    document.createElement("form");


  form.method =
    "GET";


  form.action =
    API;


  form.target =
    "kirimFrame";


  form.style.display =
    "none";


  const apiInput =
    document.createElement("input");


  apiInput.name =
    "api";


  apiInput.value =
    "scan";


  const resiInput =
    document.createElement("input");


  resiInput.name =
    "resi";


  resiInput.value =
    resi;


  form.appendChild(
    apiInput
  );


  form.appendChild(
    resiInput
  );


  document.body.appendChild(
    form
  );


  // ==================================
  // KIRIM LANGSUNG
  // ==================================

  form.submit();


  form.remove();


  // ==================================
  // JANGAN TUNGGU 700ms
  // CUKUP 250ms
  // ==================================

  setTimeout(function() {

    sedangKirim = false;

    tampil(
      "TERKIRIM",
      resi
    );

  }, 250);


  // ==================================
  // IZINKAN RESI BARU
  // ==================================

  setTimeout(function() {

    resiTerakhir = "";

    tampil(
      "SIAP SCAN",
      "-"
    );

  }, 900);

}


// ======================================
// SCAN BERHASIL
// ======================================

function onScanSuccess(decodedText) {

  const resi =
    String(decodedText || "")
      .trim();


  if (!resi) return;


  if (sedangKirim) return;


  kirimResi(resi);

}


// ======================================
// SCAN GAGAL
// ======================================

function onScanFailure(error) {

  // Abaikan
  // kamera tetap mencari barcode

}


// ======================================
// SCANNER
// ======================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 15,

      qrbox: {

        width: 300,

        height: 170

      },

      rememberLastUsedCamera:
        true,

      supportedScanTypes: [

        Html5QrcodeScanType
          .SCAN_TYPE_CAMERA

      ]

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
